<!doctype html>
<html>
<head>
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>AdTrace WebBridge Demo</title>
    <style type="text/css">
        html { font-family: Helvetica, Arial, sans-serif; color: #222; }
        h1 { color: steelblue; font-size: 20px; margin: 16px 8px; text-align: center; }
        p.hint { font-size: 12px; color: #555; margin: 0 12px 16px; text-align: center; }
        .row { width: 100%; max-width: 400px; margin: 0 auto 8px; text-align: center; }
        button { margin: 0 3px 6px; font-size: 13px; padding: 8px 12px; min-width: 220px; }
    </style>

    <!-- Step 4: AdTrace JS bridge files (shipped by android-sdk-plugin-webbridge) -->
    <script type="text/javascript" src="adtrace_event.js"></script>
    <script type="text/javascript" src="adtrace_third_party_sharing.js"></script>
    <script type="text/javascript" src="adtrace_config.js"></script>
    <script type="text/javascript" src="adtrace.js"></script>

    <!-- Step 5: App token & event tokens (edit this file for your dashboard values) -->
    <script type="text/javascript" src="adtrace_constants.js"></script>
</head>
<body>
<h1>AdTrace Web View SDK Demo</h1>
<p class="hint">SDK is initialized below. Use the buttons to track events via the JS bridge.</p>

<script type="text/javascript">
    window.onerror = function (err) {
        console.log('WebBridge page error: ' + err);
    };

    // --- Optional callbacks (Step 6 / advanced) ---

    function attributionCallback(attribution) {
        alert(
            'Tracker token = ' + attribution.trackerToken + '\n' +
            'Tracker name = ' + attribution.trackerName + '\n' +
            'Network = ' + attribution.network + '\n' +
            'Campaign = ' + attribution.campaign + '\n' +
            'Adgroup = ' + attribution.adgroup + '\n' +
            'Creative = ' + attribution.creative + '\n' +
            'Click label = ' + attribution.clickLabel
        );
    }

    function eventSuccessCallback(eventSuccess) {
        alert(
            'Message = ' + eventSuccess.message + '\n' +
            'Timestamp = ' + eventSuccess.timestamp + '\n' +
            'Adid = ' + eventSuccess.adid + '\n' +
            'Event token = ' + eventSuccess.eventToken
        );
    }

    function eventFailureCallback(eventFailure) {
        alert(
            'Message = ' + eventFailure.message + '\n' +
            'Timestamp = ' + eventFailure.timestamp + '\n' +
            'Adid = ' + eventFailure.adid + '\n' +
            'Event token = ' + eventFailure.eventToken + '\n' +
            'Will retry = ' + eventFailure.willRetry
        );
    }

    function sessionSuccessCallback(sessionSuccess) {
        alert(
            'Message = ' + sessionSuccess.message + '\n' +
            'Timestamp = ' + sessionSuccess.timestamp + '\n' +
            'Adid = ' + sessionSuccess.adid
        );
    }

    function sessionFailureCallback(sessionFailure) {
        alert(
            'Message = ' + sessionFailure.message + '\n' +
            'Timestamp = ' + sessionFailure.timestamp + '\n' +
            'Adid = ' + sessionFailure.adid + '\n' +
            'Will retry = ' + sessionFailure.willRetry
        );
    }

    function deferredDeeplinkCallback(deferredDeeplink) {
        alert('Deferred deeplink content:\n' + deferredDeeplink);
    }

    // --- Step 6a: Initialize AdTrace from JavaScript ---

    var adtraceConfig = new AdTraceConfig(
        AdTraceExampleConstants.APP_TOKEN,
        AdTraceExampleConstants.ENVIRONMENT
    );
    adtraceConfig.setLogLevel(AdTraceConfig.LogLevelVerbose);
    // adtraceConfig.setOpenDeferredDeeplink(true);
    // adtraceConfig.setSendInBackground(true);
    // adtraceConfig.setEventBufferingEnabled(false);

    adtraceConfig.setAttributionCallback(attributionCallback);
    adtraceConfig.setEventSuccessCallback(eventSuccessCallback);
    adtraceConfig.setEventFailureCallback(eventFailureCallback);
    adtraceConfig.setSessionSuccessCallback(sessionSuccessCallback);
    adtraceConfig.setSessionFailureCallback(sessionFailureCallback);
    adtraceConfig.setDeferredDeeplinkCallback(deferredDeeplinkCallback);

    AdTrace.onCreate(adtraceConfig);

    // --- Step 6b: Wire UI buttons to AdTrace APIs ---

    window.onload = function () {
        document.getElementById('btnTrackSimpleEvent').onclick = function (e) {
            e.preventDefault();
            var event = new AdTraceEvent(AdTraceExampleConstants.EVENT_TOKEN_SIMPLE);
            AdTrace.trackEvent(event);
        };

        document.getElementById('btnTrackRevenueEvent').onclick = function (e) {
            e.preventDefault();
            var event = new AdTraceEvent(AdTraceExampleConstants.EVENT_TOKEN_REVENUE);
            event.setRevenue(52000.0, 'IRR');
            AdTrace.trackEvent(event);
        };

        document.getElementById('btnTrackCallbackEvent').onclick = function (e) {
            e.preventDefault();
            var event = new AdTraceEvent(AdTraceExampleConstants.EVENT_TOKEN_CALLBACK);
            event.addCallbackParameter('key', 'value');
            event.addCallbackParameter('x', 'y');
            AdTrace.trackEvent(event);
        };

        document.getElementById('btnTrackPartnerEvent').onclick = function (e) {
            e.preventDefault();
            var event = new AdTraceEvent(AdTraceExampleConstants.EVENT_TOKEN_PARTNER);
            event.addPartnerParameter('foo', 'bar');
            AdTrace.trackEvent(event);
        };

        document.getElementById('btnTrackEventParameter').onclick = function (e) {
            e.preventDefault();
            var event = new AdTraceEvent(AdTraceExampleConstants.EVENT_TOKEN_PARAMS);
            event.addEventParameter('foo', 'bar');
            event.addEventParameter('x', 'y');
            AdTrace.trackEvent(event);
        };

        document.getElementById('btnEnableOfflineMode').onclick = function (e) {
            e.preventDefault();
            AdTrace.setOfflineMode(true);
        };

        document.getElementById('btnDisableOfflineMode').onclick = function (e) {
            e.preventDefault();
            AdTrace.setOfflineMode(false);
        };

        document.getElementById('btnEnableSdk').onclick = function (e) {
            e.preventDefault();
            AdTrace.setEnabled(true);
        };

        document.getElementById('btnDisableSdk').onclick = function (e) {
            e.preventDefault();
            AdTrace.setEnabled(false);
        };

        document.getElementById('btnIsSdkEnabled').onclick = function (e) {
            e.preventDefault();
            alert('Is SDK enabled? ' + AdTrace.isEnabled());
        };

        document.getElementById('btnGetGoogleAdId').onclick = function (e) {
            e.preventDefault();
            AdTrace.getGoogleAdId(function (gpsAdid) {
                alert('Google Play Ad Id:\n' + gpsAdid);
            });
        };
    };
</script>

<div id="buttons">
    <div class="row"><button id="btnTrackSimpleEvent">Track Simple event</button></div>
    <div class="row"><button id="btnTrackRevenueEvent">Track Revenue event</button></div>
    <div class="row"><button id="btnTrackCallbackEvent">Track Callback event</button></div>
    <div class="row"><button id="btnTrackPartnerEvent">Track Partner event</button></div>
    <div class="row"><button id="btnTrackEventParameter">Track event with Parameter</button></div>
    <div class="row"><button id="btnEnableOfflineMode">Enable Offline mode</button></div>
    <div class="row"><button id="btnDisableOfflineMode">Disable Offline mode</button></div>
    <div class="row"><button id="btnEnableSdk">Enable SDK</button></div>
    <div class="row"><button id="btnDisableSdk">Disable SDK</button></div>
    <div class="row"><button id="btnIsSdkEnabled">Is SDK Enabled?</button></div>
    <div class="row"><button id="btnGetGoogleAdId">Get Google Ad Id</button></div>
</div>
</body>
</html>
