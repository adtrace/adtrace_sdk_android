apply plugin: 'com.android.application'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "io.adtrace.examples"
        // WebBridge requires API 17+
        minSdkVersion 17
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
    namespace 'io.adtrace.examples'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation "androidx.constraintlayout:constraintlayout:2.1.1"

    // Step 1: AdTrace SDK + WebBridge plugin
    // In your own app use:
    //   implementation 'io.adtrace:android-sdk:2.6.0'
    //   implementation 'io.adtrace:android-sdk-plugin-webbridge:2.6.0'
    implementation project(':android-sdk')
    implementation project(':android-sdk-plugin-webbridge')

    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:17.1.0'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
}
