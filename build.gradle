// Top-level build file where you can add configuration options common to all sub-projects/modules.

// common in all sub-projects
subprojects {
}

ext {
    // Android config.
    coreMinSdkVersion = 21
    coreCompileSdkVersion = 34
    coreTargetSdkVersion = 34
    coreVersionName = '3.0.0'
    defaultVersionCode = 1
    webbridgeMinSdkVersion = 21
    samsungReferrerMinSdkVersion = 21
    vivoReferrerMinSdkVersion = 23

    // POM.
    adtraceGroupId = 'io.adtrace'

    coreSdkArtifactId = 'android-sdk'
    imeiSdkArtifactId = 'android-sdk-plugin-imei'
    oaidSdkArtifactId = 'android-sdk-plugin-oaid'
    webbridgeSdkArtifactId = 'android-sdk-plugin-webbridge'
    samsungReferrerSdkArtifactId = 'android-sdk-plugin-samsung'
    vivoReferrerSdkArtifactId = 'android-sdk-plugin-vivo'
    xiaomiReferrerSdkArtifactId = 'android-sdk-plugin-xiaomi'
    myketReferrerSdkArtifactId = 'android-sdk-plugin-myket'

    // Build-time only (CI). Does NOT affect SDK consumers / published POMs.
    smartechNexusUrl = 'https://repo.smartech.ir/repository/maven-sdk-group/'
}

/**
 * Optional Smartech Nexus for resolving build deps (AGP, etc.) when Google is filtered.
 * Enabled only when NEXUS_USERNAME + NEXUS_PASSWORD (or -PnexusUsername/Password) are set.
 * SDK users never need this — they get artifacts from Maven Central.
 */
ext.addSmartechNexusIfConfigured = { RepositoryHandler repos ->
    def user = rootProject.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
    def pass = rootProject.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
    if (user == null || pass == null || user.toString().trim().isEmpty() || pass.toString().trim().isEmpty()) {
        return
    }
    repos.maven {
        url rootProject.ext.smartechNexusUrl
        credentials {
            username = user.toString()
            password = pass.toString()
        }
    }
}

buildscript {
    ext {
        agp_version = '9.2.1'
        kotlin_version = '2.0.21'
    }
    repositories {
        // Prefer Nexus in CI when credentials exist (buildscript cannot call root ext yet).
        def nexusUser = System.getenv('NEXUS_USERNAME')
        def nexusPass = System.getenv('NEXUS_PASSWORD')
        if (nexusUser && nexusPass) {
            maven {
                url 'https://repo.smartech.ir/repository/maven-sdk-group/'
                credentials {
                    username = nexusUser
                    password = nexusPass
                }
            }
        }
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}


allprojects {
    repositories {
        rootProject.ext.addSmartechNexusIfConfigured(it)
        mavenCentral()
        google()
        maven { url "https://maven.myket.ir" }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

// CI / local publish: use in-memory PGP key from Gradle props (never commit the key).
// Set via CI: ORG_GRADLE_PROJECT_signingKey + ORG_GRADLE_PROJECT_signingPassword
gradle.projectsEvaluated {
    subprojects.each { sub ->
        if (!sub.plugins.hasPlugin('signing')) {
            return
        }
        def signingKey = sub.findProperty('signingKey')
        if (signingKey == null || signingKey.toString().trim().isEmpty()) {
            return
        }
        def signingPassword = (sub.findProperty('signingPassword') ?: '').toString()
        sub.signing.useInMemoryPgpKeys(signingKey.toString(), signingPassword)
    }
}
