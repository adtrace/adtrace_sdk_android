# Tag-triggered Maven Central publish (manual gate — no accidental release).
# Secrets must live in GitLab CI/CD Variables only (never in this repo).
#
# Required protected+masked variables (Settings → CI/CD → Variables):
#   SONATYPE_USERNAME   — Maven Central / OSSRH username (e.g. sdk@adtrace.io)
#   SONATYPE_PASSWORD   — Maven Central / OSSRH password or token
#   SIGNING_KEY         — ASCII-armored private PGP key (Type: Variable, masked if possible)
#   SIGNING_PASSWORD    — PGP key passphrase
#   NEXUS_USERNAME      — Smartech Nexus (repo.smartech.ir) — build deps only
#   NEXUS_PASSWORD      — Smartech Nexus password
#
# Release flow (after version bump is merged):
#   git tag v3.0.0 && git push origin v3.0.0
#   → verify_release runs automatically
#   → publish_maven waits for manual Play in GitLab UI

stages:
  - verify
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+([.-][A-Za-z0-9]+)?$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: never

default:
  interruptible: true

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  DEBIAN_FRONTEND: noninteractive

# Image already contains Android SDK (no download from dl.google.com in CI).
.jdk_android:
  image: mobiledevops/android-sdk-image:34.0.1
  before_script:
    - |
      set -e
      if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
        SDK_DIR="$ANDROID_SDK_ROOT"
      elif [ -n "${ANDROID_HOME:-}" ]; then
        SDK_DIR="$ANDROID_HOME"
      else
        echo "ERROR: ANDROID_SDK_ROOT / ANDROID_HOME not set in image"
        exit 1
      fi
      export ANDROID_SDK_ROOT="$SDK_DIR"
      export ANDROID_HOME="$SDK_DIR"
      echo "Using Android SDK at: $SDK_DIR"
      echo "sdk.dir=$SDK_DIR" > local.properties
      if [ -z "${NEXUS_USERNAME:-}" ] || [ -z "${NEXUS_PASSWORD:-}" ]; then
        echo "ERROR: NEXUS_USERNAME / NEXUS_PASSWORD are empty in this job."
        echo "1) GitLab → Settings → CI/CD → Variables: add both keys (exact names)."
        echo "2) If variables are Protected, also protect tags (Settings → Repository → Protected tags, e.g. v*)."
        echo "   Protected vars are NOT injected on unprotected tags — they look empty."
        echo "3) Username should be sdk_developer (from ~/.gradle/gradle.properties wrapperUser)."
        exit 1
      fi
      export NEXUS_USERNAME
      export NEXUS_PASSWORD
      echo "Nexus user: ${NEXUS_USERNAME}"
    - chmod +x gradlew scripts/ci/*.sh
    - java -version
    - ./gradlew --version

verify_release:
  extends: .jdk_android
  stage: verify
  script:
    - ./scripts/ci/verify-tag-version.sh
    - ./gradlew --no-daemon :android-sdk:assembleRelease :android-sdk-myket-plugin:assembleRelease
  artifacts:
    paths:
      - android-sdk/build/outputs/aar/
      - android-sdk-myket-plugin/build/outputs/aar/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+([.-][A-Za-z0-9]+)?$/

# Manual confirmation required — tagging alone does not publish.
publish_maven:
  extends: .jdk_android
  stage: release
  needs:
    - verify_release
  script:
    - ./scripts/ci/publish-to-maven.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+([.-][A-Za-z0-9]+)?$/
      when: manual
      allow_failure: false
  environment:
    name: maven-central
    action: prepare
